<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotkey Chain 设置</title>
    <!-- Vendored (MV3 forbids CDNs); replace the file in assets/ to upgrade -->
    <!-- Bootstrap 5.3.8 -->
    <link rel="stylesheet" href="assets/bootstrap.min.css" />
    <!-- Bootstrap Icons 1.13.1 — assets/fonts/ must be replaced together with this file -->
    <link rel="stylesheet" href="assets/bootstrap-icons.css" />
    <!-- Custom styles -->
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="main-container">
        <!-- Header -->
        <header class="app-header p-4 text-center">
          <h1 class="h2 mb-2" data-i18n="appTitle">🔗 Hotkey Chain 设置</h1>
          <p class="mb-0 opacity-75" data-i18n="appSubtitle">扩展设置 · 动作链管理</p>
        </header>

        <!-- 主界面 -->
        <div class="main-content p-4" id="main-view">
          <!-- 工具栏：只放控件。页面标题在 header 里说过一次，不再重复 -->
          <div class="toolbar mb-4">
            <div class="toolbar-utility">
                <div class="d-flex align-items-center gap-2">
                  <label for="localeSelect" class="small text-muted" data-i18n="settings_language">界面语言</label>
                  <select id="localeSelect" class="form-select form-select-sm">
                    <option value="auto" data-i18n="language_auto">跟随浏览器</option>
                    <option value="en">English</option>
                    <option value="zh_CN">简体中文</option>
                    <option value="zh_TW">繁體中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="pt_BR">Português (Brasil)</option>
                    <option value="ru">Русский</option>
                    <option value="it">Italiano</option>
                    <option value="ar">العربية</option>
                    <option value="hi">हिन्दी</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="tr">Türkçe</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="th">ไทย</option>
                    <option value="pl">Polski</option>
                  </select>
                </div>
                <div class="toolbar-sep" aria-hidden="true"></div>
                <button id="shortcutsBtn" class="btn btn-outline-secondary" data-i18n-title="toolbar_shortcuts" data-i18n-aria="toolbar_shortcuts" title="快捷键设置" aria-label="快捷键设置">
                  <i class="bi bi-keyboard" aria-hidden="true"></i>
                </button>
                <button id="sidePanelBtn" class="btn btn-outline-secondary" data-i18n-title="toolbar_sidePanel" data-i18n-aria="toolbar_sidePanel" title="打开侧边栏" aria-label="打开侧边栏">
                  <i class="bi bi-layout-sidebar-reverse" aria-hidden="true"></i>
                </button>
                <button id="checkAiStatusBtn" class="btn btn-outline-secondary" data-i18n-title="btn_checkAiStatus" data-i18n-aria="btn_checkAiStatus" title="检测端侧 AI 状态" aria-label="检测端侧 AI 状态">
                  <i class="bi bi-cpu" aria-hidden="true"></i>
                </button>
                <button id="exportBtn" class="btn btn-outline-secondary"><i class="bi bi-download me-1" aria-hidden="true"></i><span data-i18n="toolbar_export">导出</span></button>
                <button id="importBtn" class="btn btn-outline-secondary"><i class="bi bi-upload me-1" aria-hidden="true"></i><span data-i18n="toolbar_import">导入</span></button>
                <input type="file" id="importFileInput" accept=".json,application/json" hidden />
                <button id="restoreDefaultsBtn" class="btn btn-outline-secondary" data-i18n-title="toolbar_restoreDefaults" title="恢复默认动作链">
                  <i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i><span data-i18n="toolbar_restoreDefaults">恢复默认</span>
                </button>
            </div>
            <div class="toolbar-primary">
                <button id="templateBtn" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#templateGalleryModal">
                  <i class="bi bi-stars me-2" aria-hidden="true"></i><span data-i18n="toolbar_templates">从模板新建</span>
                </button>
                <button id="addChainBtn" class="btn btn-primary"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i><span data-i18n="toolbar_add">新建动作链</span></button>
            </div>
          </div>

          <!-- 动作链网格 -->
          <div class="chains-grid" id="chains-container">
            <!-- Populated by JavaScript -->
          </div>

          <!-- 帮助信息 -->
          <div class="help-section mt-5">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0">
                  <button class="btn btn-link text-decoration-none p-0" type="button" data-bs-toggle="collapse" data-bs-target="#helpCollapse">
                    <i class="bi bi-question-circle me-2"></i><span data-i18n="help_title">可用动作说明</span>
                    <i class="bi bi-chevron-down ms-2"></i>
                  </button>
                </h5>
              </div>
              <div id="helpCollapse" class="collapse">
                <div class="card-body">
                  <div class="actions-help">
                    <!-- Populated by JavaScript -->
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 页脚：关于扩展本身的信息，不属于工具栏（那里放的是对动作链的操作）。
               版本号从 manifest 读，报 bug 时用户说得清装的是哪一版。 -->
          <footer class="app-footer">
            <span class="footer-version">Hotkey Chain <span id="footerVersion">—</span> · MIT</span>
            <a
              class="footer-link"
              href="https://github.com/rockbenben/hotkey-chain"
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="bi bi-github" aria-hidden="true"></i><span data-i18n="footer_source">源码与反馈</span>
            </a>
          </footer>
        </div>

        <!-- 编辑界面 -->
        <div class="edit-content" id="edit-view" style="display: none">
          <!-- 编辑头部 -->
          <div class="edit-header p-4 border-bottom">
            <div class="d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center">
                <button id="backBtn" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left me-2"></i><span data-i18n="edit_back">返回</span></button>
                <div>
                  <h3 class="h4 mb-0" id="editChainTitle" data-i18n="edit_title">编辑动作链</h3>
                </div>
              </div>
              <div class="edit-actions d-flex gap-2">
                <button id="exportChainBtn" class="btn btn-outline-secondary"><i class="bi bi-download me-2"></i><span data-i18n="edit_exportChain">导出此链</span></button>
                <button id="testChainBtn" class="btn btn-outline-primary"><i class="bi bi-play me-2"></i><span data-i18n="edit_test">测试执行</span></button>
              </div>
            </div>
          </div>

          <!-- 编辑内容 -->
          <div class="edit-body p-4">
            <div class="row">
              <!-- 左侧：基本信息 -->
              <div class="col-md-4">
                <div class="chain-info-panel">
                  <h5 class="mb-3" data-i18n="info_basic">基本信息</h5>
                  <div class="mb-3">
                    <label class="form-label" data-i18n="info_name">动作链名称</label>
                    <input type="text" class="form-control" id="chainNameInput" data-i18n-placeholder="info_name_placeholder" placeholder="输入动作链名称" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" data-i18n="info_desc">描述</label>
                    <textarea class="form-control" id="chainDescInput" rows="3" data-i18n-placeholder="info_desc_placeholder" placeholder="可选：描述这个动作链的用途"></textarea>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="setAsDefaultCheck" />
                    <label class="form-check-label" for="setAsDefaultCheck" data-i18n="info_default"> 设为默认动作链 </label>
                  </div>

                  <hr />
                  <h6 class="mb-3" data-i18n="info_triggers">自动触发</h6>
                  <div class="mb-3">
                    <label class="form-label" data-i18n="info_schedule">定时运行（分钟，0 = 关闭）</label>
                    <input type="number" class="form-control" id="chainScheduleInput" min="0" max="10080" step="1" value="0" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" data-i18n="info_autoRun">页面加载时自动运行（网址规则）</label>
                    <textarea
                      class="form-control"
                      id="chainAutoRunInput"
                      rows="2"
                      data-i18n-placeholder="info_autoRun_placeholder"
                      placeholder="如 *://github.com/*，多个规则用逗号或换行分隔"
                    ></textarea>
                  </div>

                  <hr />
                  <div class="d-flex align-items-center justify-content-between mb-2">
                    <h6 class="mb-0 fw-bold" data-i18n="workflow_title">
                      <i class="bi bi-diagram-3 me-2 text-primary" aria-hidden="true"></i>工作流自动组合 (Pipeline)
                    </h6>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.7rem;">Workflow</span>
                  </div>
                  <p class="text-muted small mb-3" data-i18n="workflow_subtitle">
                    自动衔接下一步工作流，上一步输出数据自动流向下游
                  </p>

                  <div class="mb-3">
                    <label class="form-label small fw-semibold" for="chainNextStepSelect" data-i18n="workflow_nextChain">
                      <i class="bi bi-arrow-right-circle me-1 text-success" aria-hidden="true"></i>执行成功后流转至下一链
                    </label>
                    <select class="form-select form-select-sm" id="chainNextStepSelect">
                      <option value="" data-i18n="workflow_noNextChain">（无 - 执行完毕即终止）</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label small fw-semibold" for="chainFallbackStepSelect" data-i18n="workflow_fallbackChain">
                      <i class="bi bi-shield-exclamation me-1 text-warning" aria-hidden="true"></i>执行出错时流转至备用链
                    </label>
                    <select class="form-select form-select-sm" id="chainFallbackStepSelect">
                      <option value="" data-i18n="workflow_noFallbackChain">（无 - 遇错停止）</option>
                    </select>
                  </div>

                  <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="chainPassOutputCheck" checked />
                    <label class="form-check-label small" for="chainPassOutputCheck" data-i18n="workflow_passOutput">
                      向下游传递输出数据（{{output}} / 选中文本）
                    </label>
                  </div>

                  <!-- 可视化流水线流转预览框 -->
                  <div class="workflow-preview-container p-2 rounded" id="workflowMiniPipeline">
                    <!-- Populated by JavaScript -->
                  </div>
                </div>
              </div>

              <!-- 右侧：动作配置 -->
              <div class="col-md-8">
                <div class="actions-panel">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0" data-i18n="actions_title">动作序列</h5>
                    <button id="addActionBtn" class="btn btn-outline-primary btn-sm"><i class="bi bi-plus me-1"></i><span data-i18n="actions_add">添加动作</span></button>
                  </div>
                  <div class="actions-list" id="chainEditConfig">
                    <!-- Populated by JavaScript -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 模板库模态框 (Template Gallery Modal) -->
    <div class="modal fade" id="templateGalleryModal" tabindex="-1" aria-labelledby="templateGalleryModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content template-modal-content">
          <div class="modal-header border-0 pb-2">
            <div class="d-flex align-items-center gap-3">
              <div class="template-header-icon" aria-hidden="true">
                <i class="bi bi-collection-play-fill"></i>
              </div>
              <div>
                <h4 class="modal-title fw-bold" id="templateGalleryModalLabel" data-i18n="tmpl_gallery_title">动作链模板库</h4>
                <p class="text-muted small mb-0" data-i18n="tmpl_gallery_subtitle">挑选开箱即用的自动化动作链，一键添加并随心定制</p>
              </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body pt-2">
            <!-- 搜索与分类工具栏 -->
            <div class="template-toolbar mb-4">
              <div class="row g-3 align-items-center">
                <div class="col-md-5 col-lg-4">
                  <div class="input-group">
                    <span class="input-group-text bg-body-secondary border-end-0">
                      <i class="bi bi-search text-muted" aria-hidden="true"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control border-start-0 ps-0"
                      id="templateSearchInput"
                      placeholder="搜索模板名称、描述或动作..."
                      data-i18n-placeholder="tmpl_gallery_search_placeholder"
                    />
                  </div>
                </div>
                <div class="col-md-7 col-lg-8">
                  <div class="template-categories d-flex flex-wrap gap-2" id="templateCategoryFilters">
                    <!-- Populated by JavaScript -->
                  </div>
                </div>
              </div>
            </div>

            <!-- 模板卡片网格 -->
            <div class="row g-3 template-cards-grid" id="templateCardsContainer">
              <!-- Populated by JavaScript -->
            </div>

            <!-- 无匹配结果状态 -->
            <div id="templateEmptyState" class="text-center py-5 d-none">
              <div class="template-empty-icon mb-3">
                <i class="bi bi-search text-muted display-5" aria-hidden="true"></i>
              </div>
              <h5 class="fw-bold" data-i18n="tmpl_gallery_empty_title">未找到匹配的模板</h5>
              <p class="text-muted small mb-3" data-i18n="tmpl_gallery_empty_desc">请尝试更换关键词或切换上方分类</p>
              <button class="btn btn-outline-primary btn-sm" id="templateSearchResetBtn" data-i18n="tmpl_gallery_empty_reset">重置搜索</button>
            </div>
          </div>

          <div class="modal-footer border-0 pt-0 text-muted small">
            <span><i class="bi bi-info-circle me-1" aria-hidden="true"></i><span data-i18n="tmpl_gallery_footer_hint">点击任意模板即可直接创建并进入编辑，所有参数均可根据个人习惯自由调整</span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- 动作选择器模态框 (Action Picker Modal) -->
    <div class="modal fade" id="actionPickerModal" tabindex="-1" aria-labelledby="actionPickerModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content action-picker-content">
          <div class="modal-header border-0 pb-2">
            <div class="d-flex align-items-center gap-3">
              <div class="action-picker-header-icon" aria-hidden="true">
                <i class="bi bi-plus-circle-fill"></i>
              </div>
              <div>
                <h4 class="modal-title fw-bold" id="actionPickerModalLabel" data-i18n="actionPicker_title">添加动作</h4>
                <p class="text-muted small mb-0" data-i18n="actionPicker_subtitle">搜索或按分类挑选，点击即可直接添加到动作序列末尾</p>
              </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body pt-2">
            <!-- 搜索与分类工具栏 -->
            <div class="action-picker-toolbar mb-3">
              <div class="input-group mb-3">
                <span class="input-group-text bg-body-secondary border-end-0">
                  <i class="bi bi-search text-muted" aria-hidden="true"></i>
                </span>
                <input
                  type="text"
                  class="form-control border-start-0 ps-0"
                  id="actionPickerSearchInput"
                  placeholder="搜索动作名称（如深色、标签、AI、静音、截图、关闭）..."
                  data-i18n-placeholder="actionPicker_searchPlaceholder"
                  autocomplete="off"
                />
              </div>
              <div class="action-picker-categories d-flex flex-wrap gap-2" id="actionPickerCategoryFilters">
                <!-- Populated by JavaScript -->
              </div>
            </div>

            <!-- 动作列表网格容器 -->
            <div class="action-picker-grid" id="actionPickerListContainer">
              <!-- Populated by JavaScript -->
            </div>

            <!-- 无匹配状态 -->
            <div id="actionPickerEmptyState" class="text-center py-4 d-none">
              <div class="mb-2">
                <i class="bi bi-search text-muted fs-2" aria-hidden="true"></i>
              </div>
              <p class="text-muted small mb-0" data-i18n="actionPicker_noResults">未找到相关动作，请尝试更换关键词</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <!-- SortableJS 1.15.7 — drag-and-drop reordering of chains and actions -->
    <script src="assets/Sortable.min.js"></script>
    <!-- Bootstrap 5.3.8 bundle — dropdown, collapse and toast are all in use -->
    <script src="assets/bootstrap.bundle.min.js"></script>
    <script src="options.js"></script>
  </body>
</html>
